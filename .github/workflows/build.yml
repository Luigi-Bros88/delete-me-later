name: Build Aseprite

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Dependencies
        run: choco install ninja

      - name: Download Prebuilt Skia
        shell: pwsh
        run: |
          $url = "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip"
          $out = Join-Path $env:GITHUB_WORKSPACE "skia.zip"

          curl.exe -fL "$url" -o "$out"

          if (-not (Test-Path $out)) {
            throw "Skia zip was not downloaded."
          }

          if ((Get-Item $out).Length -lt 1000000) {
            throw "Downloaded Skia zip is suspiciously small; URL may be invalid or asset removed."
          }

          $skia = Join-Path $env:GITHUB_WORKSPACE "skia"
          7z x "$out" "-o$skia"

      - name: Clone Aseprite
        run: git clone --recursive https://github.com/aseprite/aseprite.git

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Run CMake & Compile
        shell: cmd
        run: |
          where cl
          if exist "%GITHUB_WORKSPACE%\aseprite\build" rmdir /s /q "%GITHUB_WORKSPACE%\aseprite\build"

          cmake -S "%GITHUB_WORKSPACE%\aseprite" -B "%GITHUB_WORKSPACE%\aseprite\build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DLAF_BACKEND=skia -DSKIA_DIR="%GITHUB_WORKSPACE%\skia" -DSKIA_LIBRARY_DIR="%GITHUB_WORKSPACE%\skia\out\Release-x64"
          if errorlevel 1 exit /b 1

          cmake --build "%GITHUB_WORKSPACE%\aseprite\build" --target aseprite --parallel
          if errorlevel 1 exit /b 1

      - name: Bundle OpenSSL runtime DLL
        shell: pwsh
        run: |
          $searchRoots = @(
            "C:\Strawberry",
            "C:\Program Files\Git",
            "C:\Program Files\OpenSSL-Win64"
          ) | Where-Object { Test-Path $_ }

          $dll = Get-ChildItem -Path $searchRoots `
            -Filter "libcrypto-3-x64.dll" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $dll) {
            throw "libcrypto-3-x64.dll was not found on the runner."
          }

          Copy-Item $dll.FullName "$env:GITHUB_WORKSPACE\aseprite\build\bin\"
          
      - name: Upload Finished Executable
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows
          path: aseprite/build/bin/
