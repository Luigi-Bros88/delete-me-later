jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Dependencies
        run: |
          choco install ninja

      - name: Download Prebuilt Skia
        run: |
          curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m124-03a54b38bf/Skia-Windows-Release-x64.zip
          7z x skia.zip -o${{ github.workspace }}\skia

      - name: Clone Aseprite
        run: |
          git clone --recursive https://github.com/aseprite/aseprite.git
      - name: Run CMake & Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd aseprite
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DLAF_BACKEND=skia -DSKIA_DIR=${{ github.workspace }}\skia -DSKIA_LIBRARY_DIR=${{ github.workspace }}\skia\out\Release-x64 -G Ninja ..
          ninja aseprite

      - name: Upload Finished Executable
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows
          path: aseprite/build/bin/
